[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neraium-poly"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "websockets>=14,<17", "rich>=13.9,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "pip-audit>=2.8,<3"]
research = [
    "pyarrow>=26,<27",
]

[project.scripts]
neraium-poly = "neraium_poly.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

# This already-enrolled model hashes its complete source. Preserve original
# prospective model identities; its import-spacing style has no runtime effect.
[tool.ruff.lint.per-file-ignores]
"backend/neraium_poly/research/phase35/weather.py" = ["I001"]
