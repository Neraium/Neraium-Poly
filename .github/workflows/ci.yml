name: Paper research certification
on:
  push:
    paths-ignore:
      - '**/*.md'
      - '.planning/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.planning/**'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAPER_TRADING: 'true'
      LIVE_TRADING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.7'
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --frozen ruff check backend tests
      - run: uv run --frozen pytest -q --junitxml=certification.xml
      - run: uv run --frozen neraium-poly scenario --output scenario.json
      - run: uv export --frozen --no-emit-project --no-hashes --format requirements-txt --output-file /tmp/audit-requirements.txt
      - run: uv run --frozen pip-audit -r /tmp/audit-requirements.txt --disable-pip --no-deps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-certification
          path: |
            certification.xml
            scenario.json
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.7'
      - run: uv sync --project .. --frozen --python 3.12
      - run: npm ci --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm test
      - run: npm audit --audit-level=high
